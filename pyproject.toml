[project]
name = "srag-report-agent"
version = "0.1.0"
description = "Agente de IA Generativa que gera relatórios sobre SRAG (Open DATASUS) com métricas, gráficos e notícias."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.1",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.2.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
srag-report = "srag_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srag_agent"]

[dependency-groups]
dev = [
    "pypdf>=7.1.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
